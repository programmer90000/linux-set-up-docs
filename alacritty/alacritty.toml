[general]
ipc_socket = true
live_config_reload = false

[window]
dimensions = { columns = 0, lines = 0 }
padding = { x = 0, y = 0 }
dynamic_padding = false
opacity = 1.0
startup_mode = "Windowed"
title = "Alacritty"
dynamic_title = true
class = { general = "Alacritty" }
decorations_theme_variant = "None"
level = "Normal"

[scrolling]
history = 100000
multiplier = 1

[font]
size = 10.0
[font.normal]
family = "Hack"
style = "Regular"
[font.bold]
family = "Hack"
style = "Bold"
[font.italic]
family = "Hack"
style = "Italic"

[colors.primary]
background = "#000000"
foreground = "#00ff00"