[general]
ipc_socket = true
live_config_reload = false

[window]
dimensions = { columns = 0, lines = 0 }
padding = { x = 0, y = 0 }
dynamic_padding = false
opacity = 1.0
startup_mode = "Windowed"
title = "Alacritty"
dynamic_title = true
class = { general = "Alacritty" }
decorations_theme_variant = "None"
level = "Normal"

[scrolling]
history = 100000
multiplier = 1

[font]
size = 10.0
[font.normal]
family = "Hack"
style = "Regular"
[font.bold]
family = "Hack"
style = "Bold"
[font.italic]
family = "Hack"
style = "Italic"

[colors.primary]
background = "#000000"
foreground = "#00ff00"
dim_foreground = "#004400"
bright_foreground = "#80ff80"

[colors.cursor]
text = "#000000"
cursor = "#00ff00"

[colors.selection]
text = "#00ff00"
background = "#1a4d1a"

[colors.normal]
black = "#000000"
red = "#FF0000"
green = "#008000"
yellow = "#FFFF00"
blue = "#0000FF"
magenta = "#FF00FF"
cyan = "#00FFFF"
white = "#FFFFFF"

[colors.bright]
black = "#808080"
red = "#FF8080"
green = "#80C080"
yellow = "#FFFF80"
blue = "#8080FF"
magenta = "#FF80FF"
cyan = "#80FFFF"
white = "#FFFFFF"

[colors.dim]
black = "#000000"
red = "#800000"
green = "#004000"
yellow = "#808000"
blue = "#000080"
magenta = "#800080"
cyan = "#008080"
white = "#808080"