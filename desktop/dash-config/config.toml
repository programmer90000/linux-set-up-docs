[[panel]]
position = "bottom"
size = 36
spacing = 4
monitors = ["*"]
left = ["app_list", "workspaces", "notifications"]
right = ["volume", "wifi", "bluetooth", "caps_lock", "date", "clock", "show_more", "power"]
more = [
    "volume",
    "copyq"
]

[widget.app_list]
items = [
    { label = "App Launcher", icon = "view-grid-symbolic", command = "nwggrid" },
    { label = "Window Switcher", icon = "window-switcher.png", command = "window-switcher" },
    { label = "Brave Browser", icon = "brave-browser", command = "brave-browser --password-store=libsecret" },
    { label = "Terminal", icon = "alacritty", command = "alacritty" },
]

[widget.clock]
format = "%H:%M"

[widget.date]
format = "%a %e %b"

[widget.notifications]
stream = "swaync-client -swb"
on_click = "swaync-client -t -sw"

[widget.power]
items = [
    { label = "Suspend",   command = "systemctl suspend" },
    { label = "Reboot",    command = "systemctl reboot" },
    { label = "Power off", command = "systemctl poweroff" },
]
