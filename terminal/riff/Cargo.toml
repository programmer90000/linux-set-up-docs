# See also .cargo/config

[package]
name = "riffdiff"
version = "3.6.1"
authors = [""]
edition = "2018"
readme = "README.md"
license = "MIT"
description = "A diff filter highlighting changed line parts"
keywords = ["diff", "git"]
categories = ["command-line-utilities"]

[[bin]]
name = "riff"
path = "src/main.rs"

[dependencies]
similar = "2.6.0"
regex = "1"
git-version = "0.3.4"
backtrace = "0.3"
bytecount = "0.6.2"
num_cpus = "1.13.0"
threadpool = "1.8.1"
itertools = "0.10.1"
rustversion = "1.0"
clap = { version = "4.5.26", features = ["derive"] }
log = { version = "0.4", features = ["std"] }
url = "2"
once_cell = "1"

[dev-dependencies]
pretty_assertions = "0.6.1"
tempfile = "3.4.0"
base64 = "0.22.1"

[profile.release]
debug = 1

lto = "thin"

[profile.release.package."*"]
debug = 0 # 0 = No debug info
