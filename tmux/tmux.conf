# Unbind the Ctrl+B prefix key and then set it again explicitly
unbind C-b
set -g prefix C-b

# Explicitly disable mouse support
set -g mouse off

# Explicitly set the base index and pane base index to 0
set -g base-index 0
setw -g pane-base-index 0

# Set pane border colours
set -g pane-border-style "fg=colour245"
set -g pane-active-border-style "fg=colour33"

# Set 256 colour support
set -g default-terminal "tmux-256color"

# Set scrollback history limit
# Note: This applies to each individual pane
set -g history-limit 20000